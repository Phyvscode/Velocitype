<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <title data-default>Velocitype</title>
    <meta property="og:image" content="/logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png" />
    <script>
      (function() {
        try {
          // Colors
          const rawColor = localStorage.getItem('velocitype_user_color');
          if (rawColor) {
            const color = JSON.parse(rawColor);
            const style = document.createElement('style');
            style.id = 'velocitype-dynamic-text-color';
            const selectors = 'h1, h2, h3, h4, h5, h6, p, span:not(.exclude-theme), a, label, li, code, strong, em, b, i, button:not(.exclude-theme), input:not(.exclude-theme), select:not(.exclude-theme), textarea:not(.exclude-theme), td, th';
            const primaryHex = (color.value.match(/#[0-9a-fA-F]{6}/g) || ['#f59e0b'])[0];
            if (color.isGradient) {
              style.innerHTML = selectors + ' { background-image: ' + color.value + ' !important; -webkit-background-clip: text !important; -webkit-text-fill-color: transparent !important; background-clip: text !important; color: transparent !important; } svg:not(.color-picker-check) { color: ' + primaryHex + ' !important; stroke: ' + primaryHex + ' !important; }';
            } else {
              style.innerHTML = selectors + ' { color: ' + color.value + ' !important; } svg:not(.color-picker-check) { color: ' + color.value + ' !important; stroke: ' + color.value + ' !important; }';
            }
            document.head.appendChild(style);
            
            // Set root variables
            document.documentElement.style.setProperty('--hot', primaryHex);
            document.documentElement.style.setProperty('--hot-soft', primaryHex + '33');
            const secondaryHex = (color.value.match(/#[0-9a-fA-F]{6}/g) || [primaryHex, primaryHex])[1] || primaryHex;
            document.documentElement.style.setProperty('--ember', secondaryHex);
          }

          // Background
          const rawBg = localStorage.getItem('velocitype_bg_color_theme');
          if (rawBg) {
            const bg = JSON.parse(rawBg);
            const style = document.createElement('style');
            style.id = 'velocitype-dynamic-bg-color';
            if (bg.isGradient) {
              style.innerHTML = ':root, html, body, #root, .bg-background { background: ' + bg.value + ' !important; background-attachment: fixed !important; }';
            } else {
              style.innerHTML = ':root, html, body, #root, .bg-background { background: ' + bg.value + ' !important; }';
            }
            document.head.appendChild(style);
          }

          // Font
          const fontType = localStorage.getItem('velocitype_font_type');
          if (fontType === 'uploaded') {
            const rawUpload = localStorage.getItem('velocitype_uploaded_font_data');
            if (rawUpload) {
               const uploaded = JSON.parse(rawUpload);
               const style = document.createElement('style');
               style.id = 'dynamic-custom-font-override';
               style.innerHTML = '@font-face { font-family: "VelocitypeUploadedFont"; src: url("' + uploaded.dataUrl + '") format("' + uploaded.format + '"); font-weight: normal; font-style: normal; font-display: swap; } * { font-family: "VelocitypeUploadedFont", system-ui, sans-serif !important; }';
               document.head.appendChild(style);
            }
          } else {
            const fontName = localStorage.getItem('velocitype_user_font');
            if (fontName && fontName !== 'Inter') {
              const formattedName = fontName.trim();
              const apiFontName = formattedName.replace(/ /g, '+');
              const link = document.createElement('link');
              link.id = 'dynamic-google-font-stylesheet';
              link.rel = 'stylesheet';
              link.href = 'https://fonts.googleapis.com/css2?family=' + apiFontName + ':wght@400;500;600;700;800&display=swap';
              document.head.appendChild(link);
              
              const style = document.createElement('style');
              style.id = 'dynamic-custom-font-override';
              style.innerHTML = '* { font-family: "' + formattedName + '", system-ui, sans-serif !important; }';
              document.head.appendChild(style);
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
